; Every GigBid process in one container. autorestart keeps a crashed server coming back;
; while one is down the API's health probe reports it and the UI shows degraded mode.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:redis]
command=redis-server --port 6379 --bind 127.0.0.1 --save "" --appendonly no
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gigsim]
command=uvicorn gigsim.server:app --host 127.0.0.1 --port 8100
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp-portfolio]
command=python -m mcp_servers.portfolio.server --port 8201
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp-marketplace]
command=python -m mcp_servers.marketplace.server --port 8202
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp-workspace]
command=python -m mcp_servers.workspace.server --port 8203
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn apps.api.main:app --host 0.0.0.0 --port 7860 --proxy-headers --forwarded-allow-ips=*
priority=30
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=bash -c "sleep 15 && exec arq worker.main.WorkerSettings"
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; one-shot: reviewer login + demo users (idempotent), then GigSim clock warm-up
[program:seed]
command=bash -c "sleep 25 && python -m scripts.seed"
priority=50
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
