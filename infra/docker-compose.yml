# docker compose -f infra/docker-compose.yml --env-file .env up --build
# Starts: web, api, worker, 3 MCP servers, GigSim, Postgres (+pgvector), Redis, Ollama (profile "local").
name: gigbid

x-py: &py
  build: { context: .., dockerfile: infra/docker/python.Dockerfile }
  env_file: ../.env
  environment: &pyenv
    DATABASE_URL: postgresql://gigbid:gigbid@postgres:5432/gigbid
    REDIS_URL: redis://redis:6379/0
    GIGSIM_URL: http://gigsim:8100
    PORTFOLIO_MCP_URL: http://mcp-portfolio:8201/mcp
    MARKETPLACE_MCP_URL: http://mcp-marketplace:8202/mcp
    WORKSPACE_MCP_URL: http://mcp-workspace:8203/mcp
    OLLAMA_BASE_URL: http://ollama:11434/v1
    GIGBID_MCP_TRANSPORT: http
  volumes:
    - processed:/app/data/processed
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16          # Postgres is also the vector store (pgvector)
    environment: { POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gigbid"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  gigsim:
    <<: *py
    command: ["uv", "run", "--no-dev", "uvicorn", "gigsim.server:app", "--host", "0.0.0.0", "--port", "8100"]
    environment: { <<: *pyenv, GIGSIM_DB: /app/data/processed/gigsim.sqlite }
    ports: ["8100:8100"]

  mcp-portfolio:
    <<: *py
    command: ["uv", "run", "--no-dev", "python", "-m", "mcp_servers.portfolio.server", "--port", "8201"]
    ports: ["8201:8201"]

  mcp-marketplace:
    <<: *py
    command: ["uv", "run", "--no-dev", "python", "-m", "mcp_servers.marketplace.server", "--port", "8202"]
    depends_on: [gigsim]
    ports: ["8202:8202"]

  mcp-workspace:
    <<: *py
    command: ["uv", "run", "--no-dev", "python", "-m", "mcp_servers.workspace.server", "--port", "8203"]
    ports: ["8203:8203"]

  api:
    <<: *py
    command: ["uv", "run", "--no-dev", "uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-portfolio: { condition: service_started }
      mcp-marketplace: { condition: service_started }
      mcp-workspace: { condition: service_started }
    ports: ["8000:8000"]

  worker:
    <<: *py
    command: ["uv", "run", "--no-dev", "arq", "worker.main.WorkerSettings"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

  ollama:                                  # local open-weight models for the "local" profile
    image: ollama/ollama:0.5.7
    profiles: ["local"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata: {}
  processed: {}
  ollama: {}
