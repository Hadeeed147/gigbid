name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Repository rules (no secrets, GigSim frozen, prompts in agent/prompts, numbers traceable)
        run: uv run python -m scripts.checks

  unit-contract:
    runs-on: ubuntu-latest
    env:
      GIGBID_FAKE_LLM: "1"
      LANGSMITH_TRACING: "false"
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_CI || 'Wl9eQ1Jq3rFz8pX2v6nB4cT7yK0hM5sD1aE3gU9iO2w=' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --group dev
      - name: Unit + integration (graphs against in-process GigSim, test-double LLM)
        run: uv run pytest tests/unit tests/integration mcp_servers -q
      - name: Contract (MCP tool-schema snapshots)
        run: uv run pytest tests/contract -q

  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      GIGBID_FAKE_LLM: "1"
      GIGBID_MCP_TRANSPORT: inprocess
      LANGSMITH_TRACING: "false"
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
      REDIS_URL: redis://localhost:6379/0
      GIGSIM_URL: http://localhost:8100
      GIGSIM_ERROR_RATE: "0"
      GIGSIM_TIME_SCALE: "600"
      JWT_SECRET: ci-jwt-secret-not-used-anywhere-else
      TOKEN_ENCRYPTION_KEY: Wl9eQ1Jq3rFz8pX2v6nB4cT7yK0hM5sD1aE3gU9iO2w=
      REVIEWER_PASSWORD: ci-reviewer-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: npm --prefix apps/web ci
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Start GigSim, API and worker
        run: |
          mkdir -p data/processed/logs
          uv run uvicorn gigsim.server:app --port 8100 > data/processed/logs/gigsim.log 2>&1 &
          uv run uvicorn apps.api.main:app --port 8000 > data/processed/logs/api.log 2>&1 &
          uv run arq worker.main.WorkerSettings > data/processed/logs/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 2; done
          uv run python -m scripts.seed
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            data/processed/logs
